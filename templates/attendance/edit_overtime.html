{% extends 'base.html' %}

{% block title %}Edit Overtime{% endblock %}

{% block content %}
  <h3>Edit Overtime for {{ employee.get_full_name|default:employee.username }}</h3>
  <form method="post" class="row g-2 align-items-end">
    {% csrf_token %}
    <input type="hidden" name="year" value="{{ year }}">
    <input type="hidden" name="month" value="{{ month }}">
    <div class="col-auto">
      <label class="form-label small">Date</label>
      <input type="date" name="overtime_date" class="form-control form-control-sm" value="{{ ot.date|date:'Y-m-d' }}" required>
    </div>
    <div class="col-auto">
      <label class="form-label small">Hours</label>
      <input type="number" step="0.25" min="0" name="overtime_hours" class="form-control form-control-sm" value="{{ ot.hours }}" required>
    </div>
    <div class="col-auto">
      <label class="form-label small">Compensation</label>
      <input type="number" step="0.01" min="0" name="compensation" class="form-control form-control-sm" value="{{ ot.compensation }}">
    </div>
    <div class="col">
      <label class="form-label small">Reason</label>
      <input type="text" name="overtime_reason" class="form-control form-control-sm" value="{{ ot.reason }}">
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-primary btn-sm">Save</button>
      <a href="{% url 'attendance:employee_attendance_detail' employee.id %}?year={{ year }}&month={{ month }}" class="btn btn-secondary btn-sm">Cancel</a>
    </div>
  </form>
{% endblock %}
