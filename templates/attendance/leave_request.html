{% extends 'base.html' %}

{% load static %}
{% load crispy_forms_tags %}

{% block title %}Leave Request{% endblock %}

{% block content %}
  <h1>Leave Request</h1>
  {% for leave in leaves %}
    <h2>{{ leave.user }}</h2>
    <h2>{{ leave.start_date }} to {{ leave.end_date }}</h2>
  {% endfor %}
{% endblock %}
